services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glory_dashboard
      POSTGRES_USER: glory
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - glory_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glory -d glory_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://glory:local-development-only@db:5432/glory_dashboard
      SESSION_SECRET: replace-this-with-a-random-secret-at-least-32-characters
      APP_ORIGIN: http://localhost:4000
      COOKIE_SECURE: "false"
    ports:
      - "4000:4000"
volumes:
  glory_pgdata:
