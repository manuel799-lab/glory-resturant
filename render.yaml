databases:
  - name: glory-business-dashboard-db
    databaseName: glory_dashboard
    user: glory_dashboard
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: glory-business-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: glory-business-dashboard-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: PGSSL
        value: "false"
